name: CD

# This fork has no live deployment — it's a submission repo, not a hosted
# satellite. The template's original deploy+verify jobs pointed at
# https://boilerplate.2plot.dev (the template author's own production site)
# by default, which is a different site with different content; they would
# fail here forever regardless of whether this repo's code is correct,
# because there is nothing of this fork's actually running at that URL.
#
# So CD is just CI on push to main: the same matrix that runs on every pull
# request, run again once a change lands, with no deploy step to skip and no
# live site to check. If a real deployment is ever added, restore the
# deploy/verify jobs from git history and point SITE_URL at that domain
# instead of the template's.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  test:
    name: ci
    uses: ./.github/workflows/ci.yml
